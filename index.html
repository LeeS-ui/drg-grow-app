@font-face{font-family:'GFB';src:local('Segoe UI Symbol'),local('Segoe UI'),local('Malgun Gothic'),local('Apple SD Gothic Neo'),local('Roboto'),local('Noto Sans KR'),local('Arial');unicode-range:U+2039,U+203A,U+2190-21FF,U+25A0-25FF,U+2713,U+2715,U+24D8}
/* Layout: phone-width column centered on desktop; fixed bottom tab bar; screens swap in one #app */
:root{
  --bg:#ffffff; --card:#ffffff; --btn:#006048; --fg:#141e1a; --sub:#5e6e69; --line:#dfe6e2;
  --brand:#11453b; --brand-fg:#ffffff; --mint:#ebf6ef; --mint-fg:#11453b;
  --warn:#d9a21b; --bad:#d6453d;
  --f-body:'Pretendard','GFB','Noto Sans KR',system-ui,sans-serif; --f-logo:'Noto Serif KR',Georgia,serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.phone{max-width:430px;margin:0 auto;min-height:var(--vh,100vh);background:var(--bg);position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.full{padding-bottom:24px}
.top{box-shadow:0 1px 6px rgba(20,30,26,.06);margin:0 -16px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;font-weight:500}
.top .t{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.logo{font-family:var(--f-logo);font-size:22px}
h1{font-size:22px;line-height:1.35;margin:8px 0 4px;font-weight:400;text-wrap:balance}
h2{font-size:17px;margin:22px 0 8px;font-weight:500}
.sub{color:var(--sub);font-size:12.5px}
.card{background:var(--card);border:1px solid #edf1ef;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.mint{background:var(--mint);border-color:transparent;color:var(--fg);box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 10px;border-radius:99px;background:var(--mint);color:var(--mint-fg)}
.chip.on{background:var(--brand);color:var(--brand-fg)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:block;width:100%;height:52px;border-radius:12px;background:var(--btn);color:var(--brand-fg);font-weight:500;font-size:15px;margin-top:12px}
.btn.out{background:#fff;color:var(--btn);border:1px solid var(--btn)}
.pl{padding:9px 16px;border-radius:99px;border:1px solid var(--line);font-weight:700;font-size:12px;background:#fff}
.pl.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.btn.ghost{background:var(--mint);color:var(--mint-fg)}
.link{display:block;margin:10px auto;color:var(--sub);font-size:12.5px;text-align:center;text-decoration:underline}
.tabs{border-radius:22px 22px 0 0;box-shadow:0 -2px 12px rgba(20,30,26,.08);position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;color:#8d8d8d}
.tabs button .ic{color:#aaa}
.tabs button.on .ic{color:var(--brand)}
.tabs button.on{color:var(--brand);font-weight:700}
.tabs svg{width:24px;height:24px}
.score{font-size:40px;font-weight:500;line-height:1}
.ring{width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring i{width:44px;height:44px;border-radius:50%;background:var(--mint);display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:8px;background:var(--card);border-radius:12px;padding:12px;margin-top:14px}
.stats b{display:block;font-size:15px;font-weight:500}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1px solid #c0c8c4;background:var(--card);border-radius:12px;padding:15px 16px;margin-bottom:10px}
.opt.on{border-color:var(--btn);background:var(--mint)}
.opt .dot{width:24px;height:24px;border-radius:50%;border:1.5px solid #c0c8c4;flex:none}
.opt.on .dot{border:7px solid var(--btn);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--brand)}
.step{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.num{width:32px;height:32px;border-radius:50%;background:#ebf6ef;color:#11453b;display:grid;place-items:center;font-weight:700;flex:none}
.step.done .num{background:#e4ece8;color:#7c8a85}
.step.done .nm{color:#9aa7a2;text-decoration:none}
.tog{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--brand)}.tog.on::after{left:21px}
.list a,.list button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 0;border-bottom:1px solid var(--line);text-align:left}
input.f,textarea.f{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card);color:var(--fg);font:inherit;margin-bottom:10px}
.seg{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.seg button{white-space:nowrap;padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px}
.seg button.on{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.dotk{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);margin-right:6px}
.hero{display:grid;place-items:center;text-align:center;min-height:70vh;gap:8px}
.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--mint),var(--brand));margin:0 auto 12px;opacity:.9}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--mint);color:var(--mint-fg)}
.chat{max-width:85%;padding:12px 14px;border-radius:14px;margin:8px 0}
.chat.me{background:var(--brand);color:var(--brand-fg);margin-left:auto}
.chat.g{background:var(--card);border:1px solid var(--line)}
svg{display:block}

.ic{display:inline-block;width:var(--s,20px);height:var(--s,20px);background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;vertical-align:middle;flex:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
﻿/* Figma alignment: visual overrides only; screen state and handlers stay intact. */
:root{--bad:#c4001d;--warn:#f1df00}
html{margin:0;padding:0}body{margin:0;font-weight:500;-webkit-font-smoothing:antialiased}
.phone{max-width:390px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-bottom:84px;overflow-x:clip}
.top{height:58px;margin:0 -24px;padding:0 24px;font-size:16px;font-weight:700;top:0}
.logo{font-family:Georgia,serif;font-size:28px;letter-spacing:-1.5px;color:#111;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
h1,h2,h3,b,strong{font-weight:700}h1{text-wrap:wrap}.sub{font-size:12px;font-weight:500}
.card{border:0;border-radius:16px;margin:20px 0;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.mint{background:#ebf6ef}.card.mint{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.btn{height:48px;font-size:14px;font-weight:700;border-radius:12px;margin-top:18px;box-shadow:0 2px 5px #00000012}
.btn.out{box-shadow:none}.btn .ic{margin-right:4px}.tabs{max-width:390px;height:58px;border-radius:18px 18px 0 0;padding:10px 8px 5px;border-color:#edf0ee;z-index:10;box-shadow:0 -1px 5px #00000008}
.tabs button{gap:1px;font-size:10px;line-height:13px}.tabs .ic{--s:22px!important}
.seg{scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{flex-shrink:0}
.tag{background:#f2f8f5;border:1px solid #e0eee7;padding:3px 6px;font-size:10px}
/* Home */
.phone:has(.design-home)>p:first-of-type{margin:20px 0 6px!important;font-size:13px}
.phone:has(.design-home)>h1{font-size:16px!important;line-height:24px;margin:0 0 10px}
.phone:has(.design-home)> .card:first-of-type{margin-top:12px}
.phone:has(.design-home)> .card:has(svg){min-height:234px}
.phone:has(.design-home)> .card:has(.stats){padding:16px;min-height:174px}
.phone:has(.design-home) .stats>div{position:relative;display:grid;grid-template-columns:32px auto;justify-content:center;align-items:center;column-gap:4px;row-gap:5px;padding-top:22px}
.phone:has(.design-home) .stats>div:before{position:absolute;top:0;left:0;right:0;font-size:10px;color:#7b817e;content:'기온'}
.phone:has(.design-home) .stats>div:nth-child(2):before{content:'습도'}.phone:has(.design-home) .stats>div:nth-child(3):before{content:'자외선'}
.phone:has(.design-home) .stats>div+div:after{content:'';position:absolute;left:-5px;top:7px;height:47px;border-left:1px solid #d7e3dd}
.phone:has(.design-home) .stats b{font-size:16px!important}.phone:has(.design-home) .stats>div:nth-child(2){color:#216080}.phone:has(.design-home) .stats .sub{grid-column:1/-1;font-size:10px;color:#777}
.phone:has(.design-home) .step{min-height:72px;border:0;padding:12px 16px;gap:12px}
.phone:has(.design-home) .step .nm{font-size:14px}.phone:has(.design-home) .step .sub{font-size:10px!important}
.phone:has(.design-home)> .card:has(.step){padding:18px 16px 14px}
.phone:has(.design-home)> .card:has(.step)>.row{margin-bottom:10px}
.phone:has(.design-home)> .card:has(.step)>.row>b:first-child{display:flex;align-items:center;gap:12px}
.phone:has(.design-home)> .card:has(ul){padding:20px 16px;line-height:1.65}
.phone:has(.design-home)> .card:has(ul)>div:nth-child(2){margin-top:16px!important}
.phone:has(.design-home)> .card:has(ul) li{margin:2px 0}
/* Shared radar card */
.card:has(svg[aria-label="5축 레이더"]){padding:12px 16px 18px!important}
.card:has(svg[aria-label="5축 레이더"])>.row{margin-top:8px!important}
.card:has(svg[aria-label="5축 레이더"])>.row>.grow{display:flex;align-items:center;padding-left:8px}
.card:has(svg[aria-label="5축 레이더"]) svg{height:132px;overflow:visible}
.card:has(svg[aria-label="5축 레이더"])>button{font-weight:600!important;padding:7px 12px!important;line-height:18px;gap:6px!important;font-size:11px!important}
/* Routine */
.phone:has(.design-routine)>.row:first-of-type{margin:24px 0!important}
.phone:has(.design-routine)>.seg{gap:4px;padding:4px 0;margin-bottom:18px}
.phone:has(.design-routine)>.seg button{padding:8px 12px!important;font-size:12px;background:#e5f1eb;border:0}
.phone:has(.design-routine)>.seg button.on{background:var(--brand)}
.phone:has(.design-routine)>.card.mint{padding:16px 18px!important;margin:20px 0 18px;min-height:98px}
.phone:has(.design-routine)>.row:has(button.mint){gap:14px;margin:18px 0!important;font-size:12px}
.phone:has(.design-routine)>.row:has(button.mint)>button{padding:12px 16px!important;gap:8px!important}
.phone:has(.design-routine)>.card:not(.mint){padding:16px!important;margin-top:20px}
.phone:has(.design-routine)>.card>button.card{padding:12px!important;border-radius:12px;margin-bottom:12px!important}
.phone:has(.design-routine)>.card>button.card:last-child{margin-bottom:0!important}
.phone:has(.design-routine)>.card>button.card>.row{gap:12px!important;min-height:70px}
.phone:has(.design-routine)>.card>button.card img{width:52px!important;height:52px!important;border-radius:8px!important}
.phone:has(.design-routine)>.card>button.card>.row>b{width:24px;flex:none}
.phone:has(.design-routine)>.card>button.card>.row>span:last-child{width:14px!important;height:14px!important;flex:none}
.phone:has(.design-routine)>.card>button.card:has(.ic-checkmark)>.row>span:last-child{width:32px!important;height:32px!important}
.phone:has(.design-routine)>.card>button.card .sub{font-size:10px!important}
.phone:has(.design-routine)>.card>button.card .mint{font-size:10px!important;line-height:1.65;padding:12px 10px!important;margin-top:12px!important}
.phone:has(.design-routine)>.mint.row:last-of-type{margin:22px -24px 0!important;padding:14px 24px!important;font-size:10px!important}
/* Explore */
.design-explore{margin:22px 0 0!important;font-size:20px!important}.design-explore+p{margin:0 0 12px}
.phone:has(.design-explore)>.seg{margin-left:-24px!important;margin-right:-24px!important;padding-left:24px!important;padding-right:24px!important}
.phone:has(.design-explore)>.seg button{padding:8px 14px!important;font-size:12px}
.phone:has(.design-explore)>button.mint{min-height:178px;background:#eff8f4;padding:16px!important;position:relative}
.phone:has(.design-explore)>button.mint h3{font-size:14px!important;margin-top:20px!important;max-width:220px}
.phone:has(.design-explore)>button.mint p{max-width:220px;font-weight:600;line-height:1.6}
.phone:has(.design-explore)>.card.list{margin-top:12px;margin-bottom:20px;padding:0 16px!important}
.phone:has(.design-explore)>.card.list button{padding:13px 0;min-height:64px;font-size:12px}
.phone:has(.design-explore)>.card.list button .row{gap:12px}.phone:has(.design-explore) .num{background:#eff7f3}
.phone:has(.design-explore)>.grid2{gap:12px}
.phone:has(.design-explore)>.grid2>.card{padding:12px!important;border-radius:18px}
.phone:has(.design-explore)>.grid2 img{aspect-ratio:1;object-fit:cover}
.phone:has(.design-explore)>.grid2 b{display:block;line-height:1.5;font-size:13px!important;min-height:40px}
/* My */
.design-my{padding-top:24px!important;align-items:flex-start}.design-my>div>b{font-size:16px!important}
.phone:has(.design-my)>.stats{margin-top:4px;gap:8px}.phone:has(.design-my)>.stats>div{padding:8px 0!important}
.phone:has(.design-my)>.card{margin:20px 0;padding:18px 16px;min-height:164px}
.phone:has(.design-my)>.card:not(.list):not(.mint)>.row:not(:first-child){padding:0 8px;margin-top:18px!important}
.phone:has(.design-my)>.card.mint{background:#eff8f4;padding:18px 16px!important}
.phone:has(.design-my)>.card.mint h3{margin:2px 0 10px!important;line-height:1.4}
.phone:has(.design-my)>.card.list{padding:16px!important}.phone:has(.design-my)>.card.list button{padding:10px 0!important;font-size:12px}
.phone:has(.design-my)>.card.list .ic{--s:18px!important;color:var(--brand)}
.phone:has(.design-my)>.row:last-child{padding:20px 0 0!important}
/* Check-in */
.design-checkin{margin:20px 0 4px!important;color:var(--brand)}.design-checkin+p{margin:0 0 22px}
.phone:has(.design-checkin)>.grid2{gap:10px 18px;margin-top:20px!important}
.opt{height:50px;padding:12px 16px;border-radius:12px}.opt.on{background:#f3f8f5}.opt.on .dot{border:6px solid #d2e3da;background:var(--btn);outline:1px solid #aec2b9;width:22px;height:22px}
.phone:has(.design-checkin)>.row:has(button[aria-label="1단계"]){margin:12px 22px 4px!important;min-height:44px}

.phone:has(>.b2-nodata)>.mint:first-of-type>b{font-size:16px!important}
.phone:has(>.b2-nodata)>.mint:first-of-type>p{font-size:12px!important;line-height:1.6!important}
.phone:has(>.b2-nodata)>.mint:nth-of-type(2){margin-top:20px!important;padding:16px!important}
.phone:has(>.b2-nodata)>.mint .card{min-height:60px;padding:12px 16px!important;border-radius:10px}
.phone:has(>.b2-nodata)>.mint .card b{font-size:12px!important}
.phone:has(>.b2-nodata)>.btn{height:48px;margin-top:20px!important}
.phone:has(>.b2-nodata)>div:last-of-type{margin:24px 0 12px}
.phone:has(>.b2-pastreports)>.card>button.card{min-height:64px}
.phone:has(>.b2-scorebasis)>.mint .bar i{background:#006048!important}
/* Guide and patterns */
.phone:has(>.b2-guide)>.card:has(button.row){padding:20px 18px!important;margin:20px 0}
.phone:has(>.b2-guide)>.card:has(button.row)>button{padding:12px 0!important}
.phone:has(>.b2-guide)>.card:has(.bar){padding:20px 18px!important;min-height:290px}
.phone:has(>.b2-guide)>.card .grid2>div>div{width:20px!important;height:20px!important}
.phone:has(>.b2-guide)>.card:has(.bar) .row:has(>.chip){margin-bottom:16px}
.phone:has(>.b2-guide)>.card:has(.bar) .bar{height:6px!important;margin:10px 0 16px}
.phone:has(>.b2-guide)>.card.row:has(>.chip){margin:8px 0!important;min-height:70px}
.phone:has(>.b2-guide)>.card.row>span:last-child{border:0;background:var(--mint)}
.phone:has(>.b2-pattern)>h1{margin:20px 0 4px!important}
.phone:has(>.b2-pattern)>.card{padding:16px!important;margin:10px 0 24px}
.phone:has(>.b2-pattern)>.card .mint{background:#f8fbf9}
.phone:has(>.b2-pattern)>.mint{padding:20px 16px!important;margin-top:22px;box-shadow:0 2px 8px #0000000a}
/* Products: rows and registration controls */
.phone:has(>.b2-closet)>button.row:has(>img):after{content:'›'}
.phone:has(>.b2-closet)>button.row:has(>img)>.grow>b{padding-top:6px!important}
.phone:has(>.b2-closet)>button.row:has(>img)>.grow>.sub{margin-top:48px!important;position:static}
.phone:has(>.b2-closet)>button.row:has(>img)>.grow>.row{margin-top:10px;flex-wrap:wrap}
.phone:has(>.b2-register)>.card.row:first-of-type{margin:20px 0 12px!important;border:1px solid #dfe7e3;box-shadow:0 1px 3px #00000008}

.phone:has(>.b2-register)>.opt{min-height:74px;padding:10px 12px!important;margin:8px 0!important}
.phone:has(>.b2-register)>.opt.on{border:2px solid #006048}
.phone:has(>.b2-register)>.card:not(.row){margin-top:12px;padding:16px!important}

.phone:has(>.b2-register)>button.row{background:#fff1f1!important;padding:16px!important;margin:20px 0 28px!important;min-height:64px}
.phone:has(>.b2-register)>.btn{margin-top:28px}
.phone:has(>.b2-use)>.card:has(>img){margin-top:20px!important}

.phone:has(>.b2-use)>.card:has(>img):not(.row)>img{border-radius:10px!important}
.phone:has(>.b2-stop){padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}

.phone:has(>.b2-stop)>.card.row:first-of-type{margin-top:16px!important;min-height:96px}
.phone:has(>.b2-stop)>.opt{min-height:58px;padding:16px 18px!important}
.phone:has(>.b2-stop)>.btn{margin-top:28px!important;height:48px}
.phone:has(>.b2-stop)>div[style*="position:fixed"]>div{max-width:390px!important;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))!important}

.phone:has(>.b2-photocmp)>.row:first-of-type{margin:20px 0!important}
.phone:has(>.b2-photocmp)>.row:first-of-type button{padding:12px 16px!important;background:#eaf6ef}
.phone:has(>.b2-photocmp)>.card{min-height:228px;padding:16px!important;margin:20px 0!important;border:1px solid #e8efeb}
.phone:has(>.b2-photocmp)>.card>.row{padding:0 12px;margin-top:18px!important;min-height:40px}
.phone:has(>.b2-photocmp)>.card>.row b{font-size:12px!important}
.phone:has(>.b2-photocmp)>.card>.row .chip{font-size:10px!important;padding:5px 8px}
.phone:has(>.b2-photocmp)>.row:not(:first-of-type){font-size:10px!important;margin-bottom:20px!important}
.phone:has(>.b2-photocmp)>.btn{height:48px;margin-top:20px}

.phone:has(>.b2-explore)>.row.card{border:1px solid #dfe8e2;box-shadow:0 1px 3px #00000008}
.phone:has(>.b2-explore)>button.mint{min-height:178px}
.phone:has(>.b2-explore)>.card.list{padding:2px 16px!important}
.phone:has(>.b2-result){padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.phone:has(>.b2-result)>div{padding-top:24px!important}
.phone:has(>.b2-result)>div>p{font-size:12px!important}
.phone:has(>.b2-result) .card{padding:18px 16px!important;margin:20px 0}
.phone:has(>.b2-result) .card>.mint{background:#eff8f3;font-size:12px!important;padding:12px!important}
.phone:has(>.b2-result) .card>.row.between{min-height:44px;font-size:12px!important}
.phone:has(>.b2-result) .card:has(.bar){padding-bottom:16px!important}
.phone:has(>.b2-result) .bar{height:8px!important}
.phone:has(>.b2-result)>div>.mint{margin:20px 0!important;padding:18px 16px!important}
.phone:has(>.b2-profile)>.card{padding:16px!important;margin:20px 0}
.phone:has(>.b2-profile)>.card:first-of-type .grid2{gap:0;background:#f2faf5;border-radius:10px}
.phone:has(>.b2-profile)>.card:first-of-type .grid2>div{border:0!important;padding:12px 4px!important}
.phone:has(>.b2-profile)>.card .btn{background:#eaf6ef!important;color:#33463e!important}
.phone:has(>.b2-profile)>.card>div[style*="margin:18px"]{margin-top:20px!important}
.phone:has(>.b2-profile)>.grid2>.mint{border-radius:10px!important;background:#e4f1e9}
.phone:has(>.b2-home){display:flex;flex-direction:column}
.phone:has(>.b2-home)>.top,.phone:has(>.b2-home)>.card,.phone:has(>.b2-home)>h1,.phone:has(>.b2-home)>p{flex-shrink:0}
.phone:has(>.b2-home)>.btn{order:1;margin-top:0;height:48px}
.phone:has(>.b2-home)>.tabs{order:2}
@media(max-width:360px){.phone:has(>.b2) .grid2{min-width:0}.phone:has(>.b2) .row{min-width:0}.phone:has(>.b2-survey)>div[style*="position:fixed"]{padding-left:18px!important;padding-right:18px!important}.phone:has(>.b2-photocmp)>.row:first-of-type button{padding:12px!important}.phone:has(>.b2-closet)>button.row:has(>img)>.grow>b{font-size:12px!important}}

.phone *,.phone button,.phone input{font-weight:300!important}
.phone h1,.phone h1 *,.phone h2,.phone h2 *,.phone h3,.phone h3 *,.phone .top .t,.phone .top .t *,.phone .hd,.phone .hd *{font-weight:700!important}
/* 데스크톱 웹: 폰 틀(Galaxy 프레임) 안에 앱 표시. 화면 389x839 / 카메라 컷아웃은 틀 이미지에 포함 */
.stage,.device,.screen,#scr{display:block}.status,.bezel{display:none}
@media (min-width:640px) and (min-height:560px){
 :root{--vh:807px}
 html,body{height:100%;overflow:hidden;background:#e9eeeb}
 .stage{height:100vh;display:grid;place-items:center}
 .device{position:relative;width:421px;height:866px;zoom:var(--z,1);flex:none}
 .screen{position:absolute;left:13.4px;top:13.4px;width:390px;height:839px;border-radius:43px;overflow:hidden;transform:translateZ(0);background:var(--bg,#fff)}
 .status{display:flex;justify-content:space-between;align-items:flex-end;height:32px;padding:0 30px 5px;font:600 12px/1 var(--f-body,sans-serif);color:#141e1a;background:var(--bg,#fff)}
 .status i{display:inline-block;width:22px;height:11px;border:1.5px solid #141e1a;border-radius:3px;position:relative}
 .status i::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:#141e1a;border-radius:1px}
 #scr{height:calc(100% - 32px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
 #scr::-webkit-scrollbar{display:none}

function radar(){const cx=82,cy=66,R=46,v=[.82,.7,.68,.66,.62],L=['수분','유분','민감도','피부 장벽','트러블'];
const pt=(i,k)=>{const a=(-90+i*72)*Math.PI/180;return [cx+Math.cos(a)*R*k,cy+Math.sin(a)*R*k]};
const poly=k=>[0,1,2,3,4].map(i=>pt(i,k).join(',')).join(' ');
const lab=[[cx,10,'middle'],[cx+R+8,cy-12,'start'],[cx+R-8,cy+R+12,'start'],[cx-R+8,cy+R+12,'end'],[cx-R-8,cy-12,'end']];
return `<svg viewBox="0 0 170 132" width="100%" role="img" aria-label="5개 지표 레이더 차트">${[.33,.66,1].map(k=>`<polygon points="${poly(k)}" fill="none" stroke="#d3dad7" stroke-width=".8"/>`).join('')}${[0,1,2,3,4].map(i=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,1)[0]}" y2="${pt(i,1)[1]}" stroke="#d3dad7" stroke-width=".8"/>`).join('')}<polygon points="${v.map((k,i)=>pt(i,k).join(',')).join(' ')}" fill="rgba(47,196,160,.28)" stroke="#2fc4a0" stroke-width="1.6"/>${lab.map((l,i)=>`<text x="${l[0]}" y="${l[1]}" font-size="8.5" font-weight="700" text-anchor="${l[2]}" fill="#141e1a">${L[i]}</text>`).join('')}</svg>`}
function chart4(){const W=300,H=110,L=[['#5b9cf0',[70,72,70,76,78,80,81]],['#6bc67f',[62,66,70,72,74,76,78]],['#ef8b57',[72,74,76,78,77,80,82]],['#f4cd4d',[84,86,85,88,86,88,90]]];
const x=i=>24+i*(W-36)/6,y=v=>H-v*H/100;
return `<svg viewBox="0 0 ${W} ${H+34}" width="100%" role="img" aria-label="주간 지표 그래프. 요일별 값 일~토. 수분 ${L[0][1].join(', ')}. 유분 ${L[1][1].join(', ')}. 민감도 ${L[2][1].join(', ')}. 트러블 ${L[3][1].join(', ')}">${[0,20,40,60,80,100].map(v=>`<line x1="22" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#e4e9e6" stroke-width=".7"/><text x="0" y="${y(v)+3}" font-size="8" fill="#5e6e69">${v}</text>`).join('')}${['일','월','화','수','목','금','토'].map((d,i)=>`<text x="${x(i)}" y="${H+14}" font-size="9" text-anchor="middle" fill="#141e1a">${d}</text>`).join('')}<line x1="${x(4)}" x2="${x(4)}" y1="0" y2="${H}" stroke="#c0c8c4" stroke-dasharray="2 2"/>${L.map(l=>`<polyline points="${l[1].map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="${l[0]}" stroke-width="1.6"/>`).join('')}<circle cx="${x(4)}" cy="${y(77)}" r="3" fill="#ef8b57"/><text x="${x(4)}" y="${y(77)-8}" font-size="9" text-anchor="middle" font-weight="700" fill="#141e1a">수분 77점</text>${[['수분',0],['유분',1],['민감도',2],['트러블',3]].map(([t,i])=>`<circle cx="${60+i*50}" cy="${H+28}" r="3" fill="${L[i][0]}"/><text x="${66+i*50}" y="${H+31}" font-size="8" fill="#141e1a">${t}</text>`).join('')}</svg><table class="sr"><caption>주간 지표 요일별 값</caption><tr><th>요일</th><th>수분</th><th>유분</th><th>민감도</th><th>트러블</th></tr>${['일','월','화','수','목','금','토'].map((d,i)=>`<tr><th>${d}</th>${L.map(l=>`<td>${l[1][i]}점</td>`).join('')}</tr>`).join('')}</table>`}

 <div class="card" style="padding:18px;margin-top:18px"><b style="font-size:15px">나의 피부 타입</b><div class="row" style="gap:16px;margin:16px 0"><span style="width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f79ab6,#f06fa0);color:#fff;font-weight:700;display:grid;place-items:center">DS-</span><span><b style="font-size:15px">건성 · 민감성</b><div style="font-size:10px;font-weight:700;color:var(--sub)">Dry · Sensitive</div><div style="font-size:10px;margin-top:6px">보습과 피부 장벽 케어가 가장 중요한 타입이에요.</div></span></div><div class="mint" style="border-radius:10px;padding:14px;font-size:10px;line-height:1.8"><b style="color:var(--brand)">이 타입의 특징</b><br>• 세안 후 쉽게 당기고 건조해요<br>• 온도·바람 등 외부 자극에 붉어지기 쉬워요<br>• 수분 장벽이 약해 보습 유지가 어려워요</div></div>
 <div class="card" style="padding:18px"><div class="row between"><b style="font-size:15px">진단 지표</b><span style="font-size:9px;color:var(--sub)">설문 6문항 기준</span></div>${[['수분 상태','낮음',30,'#11453b'],['유분 상태','낮음',40,'#11453b'],['민감도','높음',85,'#c4001d'],['장벽 안정도','주의',40,'#11453b']].map(r=>`<div style="margin-top:18px"><div class="row between" style="font-size:12px"><span>${r[0]}</span><span class="chip" style="font-size:9px;font-weight:700;${r[3]==='#c4001d'?'background:#fbdcdc;color:#c0392b':r[1]==='주의'?'background:#fdeccb;color:#8a6a0c':'background:#e8ecea;color:var(--fg)'}">${r[1]}</span></div><div class="bar" style="height:7px;margin:8px 0 0"><i style="width:${r[2]}%;background:${r[3]}"></i></div></div>`).join('')}<p style="font-size:9px;color:var(--sub);margin:16px 0 0">설문 응답 기반 참고 결과이며 의학적 진단이 아니에요.</p></div>
 <div class="card" style="padding:18px;border-left:0"><div class="row between"><b style="font-size:14px;border-left:3px solid #11453b;padding-left:8px">진단 근거 · 내가 답한 내용</b><button style="font-size:11px;font-weight:700" onclick="S.q=0;go('survey')">수정하기 ✎</button></div>${row('user','세안 후 느낌','당기고 건조함','background:#e5eee9;border-radius:6px;padding:6px 10px')}${row('checklist','건조함 빈도','가끔 느낌','')}${row('water','외부 환경에 따른 번들거림','가끔 발생','')}${row('water','최근 자주 느낀 상태','유분감 증가','background:#e5eee9;border-radius:6px;padding:6px 10px')}${row('shield','가장 신경 쓰이는 고민','민감 · 자극 반응','background:#fbdcdc;color:#c0392b;border-radius:6px;padding:6px 10px')}${row('moon-symbol','영향 요인 추정','수면 및 스트레스','')}<button class="btn" style="background:#e5eee9;color:var(--fg);font-weight:700;height:44px;font-size:12px;margin-top:16px" onclick="S.q=0;go('survey')">↻ 설문 다시 하기</button></div>
 <div class="card" style="padding:18px"><b style="font-size:15px">이런 관리부터 살펴보세요</b>${[['water','STEP 1','부드러운 세안 습관','강한 롤링과 뽀득한 마무리감 대신 미온수와 약산성 클렌저로 표면 마찰을 줄여보세요.'],['water','STEP 2','피부 상태에 맞춘 보습 조절','당김과 번들거림이 교차할 때는 유분 많은 크림을 덧바르기보다 젤/로션 제형으로 수분을 겹쳐 채워주세요.'],['user','STEP 3','자극이 느껴질 때의 미니멀루틴','새로운 고기능성 화장품을 추가하기보다는 사용하는 단계를 2~3개 이내로 줄여 안정기를 가져보세요.']].map((r,i)=>`<div class="row" style="gap:12px;align-items:flex-start;padding:14px 0;${i<2?'border-bottom:1px solid var(--line)':''}"><span style="width:36px;height:36px;border-radius:10px;background:var(--mint);display:grid;place-items:center;flex:none">${I(r[0],18)}</span><span style="font-size:10px"><span class="chip" style="border:1px solid #11453b;background:#fff;font-size:9px;font-weight:700">${r[1]}</span> <b style="font-size:13px">${r[2]}</b><div style="margin-top:6px;color:var(--sub)">${r[3]}</div></span></div>`).join('')}</div>
 <div class="mint" style="border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)"><b style="font-size:15px">더 이야기하고 싶은 부분이 있나요?</b><p style="font-size:11px;font-weight:500;margin:8px 0 14px">지금 답변하신 내용을 바탕으로 필요한 추가 질문만 자연스럽게 이어나갈게요.</p><button class="card" style="width:100%;margin:0;height:46px;font-weight:700;font-size:12px;box-shadow:none" onclick="go('chat',1)">로이와 이어서 대화하기 →</button></div>
 <div class="row between" style="margin-top:22px"><span><b style="font-size:16px">관련 피부 지식</b><div style="font-size:10px;color:var(--sub)">믿을 수 있는 연구 데이터를 읽어보세요</div></span>${I('bookmark',22)}</div>${[['부드러운 세안과 유수분 보습 가이드','자극 없는 클렌징 제형 선택 및 유효 성분 가이드라인'],['피부 장벽과 수분 보유 능력 알아보기','각질층 지질 구조와 무너진 피부 밸런스를 복원하는 루틴']].map(r=>`<button class="card row" style="width:100%;text-align:left;gap:14px;padding:10px 14px 10px 10px" onclick="go('knowledge',1)"><span style="width:60px;height:60px;border-radius:8px;background:linear-gradient(135deg,#dfeae4,#b9cfc5);flex:none"></span><span class="grow" style="font-size:10px"><b style="font-size:13px">${r[0]}</b><div class="sub" style="margin-top:4px">${r[1]}</div></span>›</button>`).join('')}
 <button class="btn" style="font-weight:700;margin-top:18px" onclick="tab('home')">G:ROW 시작하기</button></div>`},
perm:()=>`<span hidden class="b1 b1-perm"></span><div style="background:#c5d0cc;margin:0 -16px;min-height:var(--vh,100vh);display:flex;flex-direction:column"><div style="flex:1"></div><div style="background:#fff;border-radius:28px 28px 0 0;padding:14px 25px 28px;box-shadow:0 -10px 30px rgba(0,0,0,.12)"><div style="width:40px;height:4px;border-radius:9px;background:#d5e3dc;margin:0 auto 22px"></div><span style="width:48px;height:48px;border-radius:50%;background:#e7f1ec;display:grid;place-items:center">${I('camera',22)}</span><h1 style="font-size:16px;font-weight:700;margin:18px 0 10px">피부 사진을 기록할까요?</h1><p style="font-size:11px;font-weight:500;line-height:1.5;margin:0 0 20px">피부 변화를 사진으로 비교하려면<br>사진 접근 권한이 필요해요.</p>

<div class="row" style="gap:12px;background:#e6efea;border-radius:12px;padding:16px;margin:14px 0 18px;font-size:10px;font-weight:700;color:var(--brand)">${I('shield',20)}사진은 사용자가 선택한 경우에만 피부 기록에 추가돼요.</div>
<button class="btn" style="font-weight:700;margin:0" onclick="pickPhoto()">사진 선택하기</button><div style="text-align:center"><button style="font-size:11px;font-weight:700;margin:16px 0 14px" onclick="back()">나중에</button><br><button style="font-size:9px;font-weight:700;color:var(--sub)" onclick="toast('설정 > 앱 권한에서 바꿀 수 있어요')">권한 안내 보기</button></div></div></div>`,
photocmp:()=>{const t=S.pcmp||0;const bg=(pos)=>`background-image:url(${IMG.ph});background-size:300% 100%;background-position:${pos}% 0;`;const pair=[[0,100,'Day 01','Day 90 (최근)','06.26 · 초기 붉은기','09.24 · 장벽 보호 형성'],[0,50,'Day 01','Day 45','06.26 · 초기 붉은기','08.10 · 진정 안정기'],[50,100,'Day 45','Day 90 (최근)','08.10 · 진정 안정기','09.24 · 장벽 보호 형성']][t];
 return `<span hidden class="b2 b2-photocmp"></span><div class="top"><button onclick="back()" aria-label="뒤로">${I('left',22)}</button><span class="t" style="font-weight:700">사진 비교</span><span>${csb()}${cls()}</span></div>
 <div class="row" style="gap:8px;margin:16px 0;overflow-x:auto">${['Day 01 ↔ 90','Day 01 ↔ 45','Day 45 ↔ 90'].map((x,i)=>`<button onclick="S.pcmp=${i};render()" style="padding:12px 16px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;${t===i?'background:#11453b;color:#fff':'background:#e8f3ed'}">${x}</button>`).join('')}</div>
 <div class="grid2" style="gap:12px"><div><div style="height:200px;border-radius:14px;${bg(pair[0])}"></div><b style="display:block;font-size:12px;margin:12px 0 4px">${pair[2]}</b><span style="font-size:9px;font-weight:700;color:var(--sub)">${pair[4]}</span></div><div><div style="height:200px;border-radius:14px;${bg(pair[1])}"></div><b style="display:block;font-size:12px;margin:12px 0 4px">${pair[3]}</b><span style="font-size:9px;font-weight:700;color:var(--sub)">${pair[5]}</span></div></div>
 <div class="card" style="padding:16px;margin:18px 0"><b style="font-size:13px">같은 구간에 기록된 변화</b>${[['붉은기·열감 기록','30일 전 대비 발생 빈도 약 50% 감소','개선'],['당김 증상 기록','건조한 환경에서 반복 기록','관리 필요'],['트러블 반응','최근 2주 무자극 상태 유지','안정']].map(r=>`<div class="row between" style="margin-top:16px"><span style="font-size:9px;color:var(--sub)"><b style="font-size:11px;color:var(--fg)">${r[0]}</b><br>${r[1]}</span><span class="chip" style="font-size:9px;font-weight:700;background:#e5eee9;color:var(--fg)">${r[2]}</span></div>`).join('')}</div>
 <div class="row" style="gap:8px;font-size:9px;color:var(--sub);align-items:flex-start;margin:0 4px 18px">ⓘ<span>같은 조명과 각도에서 촬영할수록 비교가 정확해요. 사진 분석은 의학적 진단이 아닙니다.</span></div>
 <button class="btn" style="font-weight:700" onclick="toast('카메라는 앱에서 사용할 수 있어요')">${I('camera',18)} 새 사진 촬영하기</button><button class="btn out" style="font-weight:700" onclick="toast('비교 이미지를 저장했어요')">⇩ 비교 이미지 저장</button>`},

<b style="display:block;font-size:16px;margin:22px 0 6px">내 데이터</b>${[['피부 프로필','피부 유형, 주요 고민, 관리 목표','profile','user'],['피부 기록','데일리 체크인, 피부 상태, 사진 기록','mydata','survey'],['루틴·제품','루틴 설정과 제품 사용 기록','closet','folder-invoices'],['리포트','주간 리포트와 피부 변화 기록','pastreports','bar-chart']].map((r,i)=>`<button class="row" style="width:100%;text-align:left;gap:14px;padding:14px 0;${i<3?'border-bottom:1px solid var(--line)':''}" onclick="go('${r[2]}',1)"><span style="width:40px;height:40px;border-radius:50%;background:var(--mint);display:grid;place-items:center;flex:none">${I(r[3],20)}</span><span class="grow"><b style="font-size:13px">${r[0]}</b><div style="font-size:10px;color:var(--sub);font-weight:500">${r[1]}</div></span>›</button>`).join('')}
<b style="display:block;font-size:16px;margin:26px 0 6px">데이터 활용</b><div class="row between" style="padding:12px 0;border-bottom:1px solid var(--line)"><span><b style="font-size:13px">개인화된 관리 경험</b><div style="font-size:10px;color:var(--sub);font-weight:500">내 기록을 바탕으로 피부 변화와 관리 정보를 정리</div></span><span class="chip" style="font-weight:700">동의 ›</span></div><button class="row between" style="width:100%;text-align:left;padding:12px 0" onclick="go('photocmp',1)"><span><b style="font-size:13px">피부 사진</b><div style="font-size:10px;color:var(--sub);font-weight:500">피부 변화 비교를 위해 직접 등록한 사진 관리</div></span><span style="font-size:11px;font-weight:700;color:var(--brand)">사진 관리 ›</span></button>
<b style="display:block;font-size:16px;margin:26px 0 6px">내 데이터 관리</b>${[['내 데이터 다운로드','기록을 파일로 내보내기'],['데이터 이용 내역',''],['개인정보 처리방침',''],['계정 및 데이터 삭제','계정 및 서비스 이용 기록 삭제']].map((r,i)=>`<button class="row between" style="width:100%;text-align:left;padding:14px 0;${i<3?'border-bottom:1px solid var(--line)':''}" onclick="toast('이 항목은 아직 준비 중이에요')"><span><b style="font-size:13px">${r[0]}</b>${r[1]?`<div style="font-size:10px;color:var(--sub);font-weight:500">${r[1]}</div>`:''}</span>›</button>`).join('')}
<div class="mint row" style="border-radius:12px;padding:16px;gap:12px;margin:26px 0"><span style="width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none">${I('shield',20)}</span><span style="font-size:11px"><b style="font-size:13px">내 기록은 내가 관리해요</b><br>피부 기록과 관리 정보는 설정에서 언제든 확인하고 관리할 수 있어요. 제3자에게 임의로 제공되지 않습니다.</span></div>`,

<b style="display:block;font-size:16px;margin:24px 0 12px">앞으로 어떻게 관리할까요?</b><div class="mint" style="border-radius:14px;padding:18px;border:1px solid #cfe0d6"><div class="row between"><b style="font-size:15px;color:var(--brand)">현재 목표 유지</b><span class="chip on" style="font-size:10px;font-weight:700;border-radius:6px">권장</span></div><p style="font-size:10px;line-height:1.7;margin:10px 0">지금 설정한 <b>수분 장벽 집중 루틴</b>을 유지하여 유수분 균형 변화를 계속 축적합니다.</p><div style="font-size:10px;font-weight:700;color:var(--brand)">↻ 선택 시 데일리 대시보드로 이동하며 기존 스킨 로그가 보존됩니다.</div></div>
<button class="card" style="width:100%;text-align:left;padding:18px;margin:12px 0" onclick="go('goal',1)"><div class="row between"><b style="font-size:15px">관리 목표 다시 설정</b>›</div><p style="font-size:10px;margin:8px 0">계절 변화나 새로운 피부 고민에 맞춰 우선순위 카테고리와 루틴 항목을 재구성합니다.</p><span style="font-size:10px">${I('edit',14)} 심층 목표 설정 진단 플로우로 이동합니다.</span></button>`,
libres:()=>{const r=libQ(S.lq,S.lf),nf=S.lf.c.length+S.lf.t.length;return `${hdr('검색 결과')}<div class="row card" style="padding:0 14px;height:48px;margin:14px 0 8px;gap:10px">${I('search',20)}<input id="q2" aria-label="검색어" enterkeyhint="search" value="${esc(S.lq)}" onkeydown="if(event.key==='Enter'&&!event.isComposing){S.lq=this.value.trim();render()}" style="flex:1;border:0;background:none;font:inherit;min-width:0" placeholder="피부 고민, 성분, 제품을 검색해보세요"></div>
<div class="row between" style="margin:12px 0"><span class="sub" role="status">${S.lq?'“'+esc(S.lq)+'” · ':''}${nf?'필터 '+nf+'개 · ':''}총 ${r.length}건</span><button class="pl" onclick="openFilter()">${I('settings',16)} 필터</button></div>${r.map(libRow).join('')||libEmpty()}`}
};
function chart(p){const d={'7일':[72,70,74,73,77,76,78],'30일':[70,66,60,63,68,73,77],'3개월':[58,62,60,66,70,74,77]}[p];const W=300,H=120,pts=d.map((v,i)=>[10+i*(W-20)/6,H-((v-50)/50)*H+0]);
 return `<svg viewBox="0 0 ${W} ${H+24}" width="100%" role="img" aria-label="민감도 개선 추이">${[60,70,80,90].map(v=>{const y=H-((v-50)/50)*H;return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="0" y="${y-3}" font-size="9" fill="var(--sub)">${v}</text>`}).join('')}
 <polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${i===6?5:3}" fill="${i===6?'var(--brand)':'var(--card)'}" stroke="var(--brand)" stroke-width="2"/>`).join('')}
 <text x="${pts[6][0]-8}" y="${pts[6][1]-10}" font-size="11" font-weight="700" text-anchor="end" fill="var(--fg)">${d[6]}점</text></svg>`}
function toast(m){const t=document.createElement('div');t.textContent=m;t.setAttribute('role','status');t.setAttribute('aria-live','polite');t.style.cssText='position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--brand);color:var(--brand-fg);padding:10px 18px;border-radius:99px;z-index:20;font-size:13px';document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function chatSend(v){const g=t=>S.chat.push({k:'g',t});S.chat=S.chat.filter(x=>x.k!=='q');
 if(v==='오늘 피부 상태 기록하기'){go('checkin',1);return}
 S.chat.push({k:'me',t:v});
 if(v==='피부 고민 묻기'){g('안녕하세요! 지금 가장 신경 쓰이는 피부고민은 무엇인가요?');g('편안하게 하나를 골라주시거나 아래에 직접 적어주셔도 괜찮아요.');S.chat.push({k:'q',t:['당김 · 건조','번들거림','트러블','붉은 기','잘 모르겠어요']})}
 else if(v==='웹에서 시작한 결과 가져오기'){g('웹에서 진행한 결과를 불러왔어요. 건성 · 민감성 피부 타입이에요.');S.chat.push({k:'q',t:['결과 자세히 보기','이어서 대화하기']})}
 else if(v==='결과 자세히 보기'){go('result',1);return}
 else if(['당김 · 건조','번들거림','트러블','붉은 기'].includes(v)){g(v==='당김 · 건조'?'세안 후 당김이 느껴지는군요.':'“'+v+'” 고민이시군요.');S.chat.push({k:'in',t:'수분 손실(TEWL) 가능성 감지',s:'클렌징 루틴의 계면활성제나 유수분 밸런스를 확인합니다.'});g('최근 세안 방법이나 사용하는 클렌징 제품이 달라졌나요?');S.chat.push({k:'q',t:['바뀌었어요','그대로예요','잘 모르겠어요 / 건너뛰기']})}
 else{g('알려주셔서 고마워요. 기록해 두고 루틴 제안에 반영할게요.')}
 render();scrTo(1e6)}
function pickPhoto(){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{if(f.files&&f.files[0]){toast('사진을 선택했어요');go('photocmp')}};f.click()}
function exportData(){try{const b=new Blob([JSON.stringify({records:S.records,routine:S.routine,ans:S.ans,prods:S.prods},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='grow-data.json';document.body.appendChild(a);a.click();a.remove();toast('기록을 파일로 내보냈어요')}catch(e){toast('내보내지 못했어요. 다시 시도해 주세요')}}
function send(){const i=$('#msg'),v=i.value.trim();if(!v)return;chatSend(v);const n=$('#msg');if(n)n.focus()}
const main=['home','record','explore','routine','my','report','pattern','guide','nodata'],full=['start','login','signup','done','survey','result','scan','perm','goal'];
function modal(){return `<div style="position:fixed;inset:0;background:rgba(40,46,43,.5);z-index:40"><div style="position:absolute;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:14px 24px calc(24px + env(safe-area-inset-bottom,0px))"><div style="width:40px;height:4px;border-radius:9px;background:#d5e3dc;margin:0 auto 18px"></div><b style="font-size:15px">이 제품 사용을 중단할까요?</b><p style="font-size:11px;font-weight:700;color:var(--brand);line-height:1.7;margin:14px 0 4px">사용을 중단해도 지금까지의 피부 기록과 제품 사용 이력은 삭제되지 않고 안전하게 보관돼요.</p><p style="font-size:11px;font-weight:500;line-height:1.7;margin:0 0 22px">언제든지 과거 리포트와 비교 보기에서 이 제품을 사용했던 기간의 기록을 다시 확인할 수 있습니다.</p><div class="grid2" style="gap:12px"><button style="height:52px;border-radius:12px;background:#e4eee8;font-weight:700;font-size:13px" onclick="S.stopModal=0;render()">취소</button><button style="height:52px;border-radius:12px;background:#1f6b5a;color:#fff;font-weight:700;font-size:13px" onclick="stopProd()">중단하기</button></div></div></div>`}
let fabObs=null;
function setupFab(){if(fabObs){fabObs.disconnect();fabObs=null}if(S.screen!=='home'||typeof IntersectionObserver!=='function')return;const b=document.getElementById('chk'),f=document.getElementById('fab');if(!b||!f)return;fabObs=new IntersectionObserver(es=>{const e=es[es.length-1];f.classList.toggle('show',!e.isIntersecting)},{root:scrEl(),rootMargin:'0px 0px -70px 0px',threshold:0.01});fabObs.observe(b)}
function render(){['f','g','h'].forEach(k=>{if(S.notif[k]===undefined)S.notif[k]=1});const a=$('#app'),s=S.screen;const ae=document.activeElement,fid=ae&&ae.id,fs=ae&&ae.selectionStart;a.className='phone'+(full.includes(s)?' full':'');a.innerHTML=V[s]()+(main.includes(s)?tabs():'')+(S.stopModal&&s==='stop'?modal():'');try{const PN=/^(약산성 클렌징 젤 폼|레드 블레미쉬[^·]*|더모이스처 배리어[^·]*|더마이스처 배리어[^·]*|그린 마일드 업 선 플러스.*)$/;a.querySelectorAll('*').forEach(e=>{if(e.children.length===0){const t=e.textContent.trim();if(t.length<45&&(PN.test(t)||(t.length>=8&&(S.prods||[]).some(q=>Object.values(q).includes(t)))))e.classList.add('pn')}})}catch(x){}
try{a.querySelectorAll('*').forEach(e=>{if(e.tagName==='BUTTON'||e.closest('button')||e.tagName==='H1'||e.tagName==='H2'||e.tagName==='H3'||e.tagName==='I')return;if(parseFloat(getComputedStyle(e).fontSize)>=15&&e.childNodes.length&&[...e.childNodes].some(n=>n.nodeType===3&&n.textContent.trim()))e.classList.add('hd');else if(e.tagName==='B'&&e.parentElement&&e.parentElement.classList.contains('card')&&e.parentElement.firstElementChild===e)e.classList.add('hd')})}catch(x){}try{document.querySelectorAll('input:not([type=checkbox]),textarea').forEach(e=>{e.readOnly=true;e.setAttribute('inputmode','none');e.tabIndex=-1});}catch(x){}setupFab();if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(fs!=null)el.setSelectionRange(fs,fs)}catch(e){}}}}
render();
</script>
